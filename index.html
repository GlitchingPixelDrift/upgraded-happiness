<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Bird Clone</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(180deg, #7dd3fc 0%, #e0f2fe 100%);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .game-wrapper {
        text-align: center;
      }

      canvas {
        border: 4px solid #0f172a;
        background: linear-gradient(180deg, #38bdf8 0%, #e2e8f0 100%);
        display: block;
        border-radius: 12px;
      }

      .hint {
        margin-top: 12px;
        color: #0f172a;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="game-wrapper">
      <canvas id="game" width="360" height="520"></canvas>
      <div class="hint">Press Space or click to flap. Avoid the pipes!</div>
    </div>

    <script>
      // Grab the canvas and set up the drawing context.
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");

      // ----- Physics tuning knobs -----
      // Gravity pulls the bird down every frame. Bigger = faster falling.
      const GRAVITY = 0.45;
      // Jump strength applies an instant upward velocity when the player flaps.
      const JUMP_STRENGTH = -8.5;
      // Pipe speed moves pipes left each frame. Bigger = faster obstacles.
      const PIPE_SPEED = 2.2;
      // Gap size between top and bottom pipes. Smaller = harder.
      const PIPE_GAP = 140;
      // How many frames between pipe spawns.
      const PIPE_INTERVAL = 110;

      // ----- Game state -----
      const bird = {
        x: 90,
        y: canvas.height / 2,
        size: 22,
        velocity: 0,
      };

      let pipes = [];
      let frame = 0;
      let score = 0;
      let bestScore = 0;
      let gameOver = false;

      // Create a new pipe pair with a randomized gap.
      function createPipe() {
        const padding = 50;
        const maxTop = canvas.height - PIPE_GAP - padding;
        const topHeight = Math.floor(
          Math.random() * (maxTop - padding + 1) + padding
        );

        pipes.push({
          x: canvas.width,
          topHeight,
          passed: false,
        });
      }

      function resetGame() {
        bird.y = canvas.height / 2;
        bird.velocity = 0;
        pipes = [];
        frame = 0;
        score = 0;
        gameOver = false;
      }

      // Apply upward velocity if the game is running. Restart if game over.
      function flap() {
        if (gameOver) {
          resetGame();
          return;
        }
        bird.velocity = JUMP_STRENGTH;
      }

      // Input handlers for spacebar and mouse/touch.
      window.addEventListener("keydown", (event) => {
        if (event.code === "Space") {
          event.preventDefault();
          flap();
        }
      });

      window.addEventListener("mousedown", flap);
      window.addEventListener("touchstart", flap, { passive: true });

      // Collision detection using Axis-Aligned Bounding Box (AABB).
      function checkCollision(pipe) {
        const birdLeft = bird.x - bird.size / 2;
        const birdRight = bird.x + bird.size / 2;
        const birdTop = bird.y - bird.size / 2;
        const birdBottom = bird.y + bird.size / 2;

        const pipeWidth = 60;
        const pipeLeft = pipe.x;
        const pipeRight = pipe.x + pipeWidth;

        const hitsPipeHorizontally = birdRight > pipeLeft && birdLeft < pipeRight;
        const hitsTopPipe = birdTop < pipe.topHeight;
        const hitsBottomPipe =
          birdBottom > pipe.topHeight + PIPE_GAP &&
          birdTop < canvas.height;

        return hitsPipeHorizontally && (hitsTopPipe || hitsBottomPipe);
      }

      function update() {
        frame += 1;

        // Apply gravity to velocity, then move the bird.
        bird.velocity += GRAVITY;
        bird.y += bird.velocity;

        // Spawn pipes at regular intervals.
        if (frame % PIPE_INTERVAL === 0) {
          createPipe();
        }

        // Move pipes left and check scoring/collisions.
        pipes.forEach((pipe) => {
          pipe.x -= PIPE_SPEED;

          // Score increases once per pipe when the bird passes it.
          if (!pipe.passed && pipe.x + 60 < bird.x) {
            pipe.passed = true;
            score += 1;
            bestScore = Math.max(bestScore, score);
          }

          if (checkCollision(pipe)) {
            gameOver = true;
          }
        });

        // Remove off-screen pipes.
        pipes = pipes.filter((pipe) => pipe.x + 60 > 0);

        // Check collision with top/bottom of the screen.
        if (bird.y - bird.size / 2 <= 0 || bird.y + bird.size / 2 >= canvas.height) {
          gameOver = true;
        }
      }

      function drawBackground() {
        ctx.fillStyle = "#bae6fd";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      function drawBird() {
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.arc(bird.x, bird.y, bird.size / 2, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawPipes() {
        const pipeWidth = 60;
        pipes.forEach((pipe) => {
          ctx.fillStyle = "#22c55e";
          // Top pipe
          ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
          // Bottom pipe
          ctx.fillRect(
            pipe.x,
            pipe.topHeight + PIPE_GAP,
            pipeWidth,
            canvas.height - pipe.topHeight - PIPE_GAP
          );

          // Pipe borders
          ctx.strokeStyle = "#15803d";
          ctx.lineWidth = 4;
          ctx.strokeRect(pipe.x, 0, pipeWidth, pipe.topHeight);
          ctx.strokeRect(
            pipe.x,
            pipe.topHeight + PIPE_GAP,
            pipeWidth,
            canvas.height - pipe.topHeight - PIPE_GAP
          );
        });
      }

      function drawScore() {
        ctx.fillStyle = "#0f172a";
        ctx.font = "bold 20px 'Segoe UI'";
        ctx.fillText(`Score: ${score}`, 16, 32);
        ctx.font = "14px 'Segoe UI'";
        ctx.fillText(`Best: ${bestScore}`, 16, 52);
      }

      function drawGameOver() {
        if (!gameOver) return;

        ctx.fillStyle = "rgba(15, 23, 42, 0.75)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#f8fafc";
        ctx.font = "bold 32px 'Segoe UI'";
        ctx.textAlign = "center";
        ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 20);

        ctx.font = "18px 'Segoe UI'";
        ctx.fillText("Press Space or Click to Restart", canvas.width / 2, canvas.height / 2 + 20);
        ctx.textAlign = "left";
      }

      function gameLoop() {
        if (!gameOver) {
          update();
        }
        drawBackground();
        drawPipes();
        drawBird();
        drawScore();
        drawGameOver();

        requestAnimationFrame(gameLoop);
      }

      // Start the game loop.
      gameLoop();
    </script>
  </body>
</html>
